<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 | NetProbe</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand"><span>NP</span><div><strong>NetProbe</strong><small>NETWORK DIAGNOSTIC CONSOLE</small></div></div>
    <h1>로그인</h1>
    <p class="login-description">네트워크 진단 콘솔을 사용하려면 계정으로 로그인하세요.</p>
    <form id="login-form">
      <label for="username">아이디</label>
      <input id="username" autocomplete="username" required maxlength="50">
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required maxlength="128">
      <p id="login-error" class="login-error" role="alert"></p>
      <button class="btn-run login-button" type="submit"><span class="btn-label">로그인</span></button>
    </form>
  </main>
  <script src="/static/js/login.js"></script>
</body>
</html>
